<!-- ==================== SCRIPT COMMUN — À COPIER AVEC LE BLOC ====================
  À coller UNE fois par page, après le bloc FR ou EN (ou dans le même bloc HTML).
  Lazy-load : l'iframe ne charge chat.tisanes.ca qu'à l'ouverture du modal.
-->
<script>
(function () {
  if (window.__tisanesModalInit) return;
  window.__tisanesModalInit = true;

  function rootOf(el) {
    return el.closest('[data-tisanes-cta]') || document;
  }

  function openModal(root) {
    var modal = root.querySelector('[data-tisanes-modal]');
    if (!modal) return;
    var frame = modal.querySelector('[data-tisanes-frame]');
    if (frame && !frame.getAttribute('src')) {
      frame.setAttribute('src', frame.getAttribute('data-src'));
    }
    modal.setAttribute('data-open', 'true');
    document.documentElement.style.overflow = 'hidden';
    var closeBtn = modal.querySelector('[data-tisanes-close]');
    if (closeBtn) closeBtn.focus();
  }

  function closeModal(modal) {
    var open = modal || document.querySelector('[data-tisanes-modal][data-open="true"]');
    if (!open || !open.setAttribute) return;
    open.setAttribute('data-open', 'false');
    document.documentElement.style.overflow = '';
  }

  document.addEventListener('click', function (ev) {
    var opener = ev.target.closest('[data-tisanes-open]');
    if (opener) {
      ev.preventDefault();
      openModal(rootOf(opener));
      return;
    }
    var closer = ev.target.closest('[data-tisanes-close]');
    if (closer) {
      closeModal(closer.closest('[data-tisanes-modal]'));
      return;
    }
    var modal = ev.target.closest('[data-tisanes-modal]');
    if (modal && ev.target === modal) closeModal(modal);
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') closeModal();
  });

  window.addEventListener('message', function (ev) {
    if (ev.origin !== 'https://chat.tisanes.ca') return;
    if (ev.data && ev.data.type === 'tisanes:close') closeModal();
  });
})();
</script>
<!-- ==================== FIN SCRIPT COMMUN ==================== -->
